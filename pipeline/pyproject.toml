[project]
name = "memchal"
version = "0.1.0"
description = "Retrieval, evidence packing and the Reactor runner for the Memory Retrieval Challenge"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.3.16",
    "einops>=0.8.2",
    "mlx-lm>=0.32.2",
    "numpy>=2.5.4",
    "pystemmer>=3.1.0",
    "sentence-transformers>=5.6,<6",
    "torch>=2.15.0",
    "websockets>=14",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
